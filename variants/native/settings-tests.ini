; Headless firmware persistence tests, with the actual Settings bridges and filesystem.
[env:native-settings-test]
extends = env:native
build_flags = ${env:native.build_flags}
  -D TUI_SETTINGS_HOST_TEST
build_src_filter = ${native_base.build_src_filter}
  -<TDeck*>
  -<chess/*test.c>
  +<TDeckSettingsPersistence.cpp>
  +<TDeckClockFormat.cpp>
  +<TDeckUnits.cpp>
  +<TDeckTimeZone.cpp>
  +<TDeckBeep.cpp>
lib_ignore = ${portduino_base.lib_ignore}
  meshtastic-device-ui
test_filter = test_admin_radio
test_testing_command =
  ${platformio.src_dir}/../bin/pio-test-isolate.sh
  ${platformio.build_dir}/${this.__env__}/meshtasticd
  -s
